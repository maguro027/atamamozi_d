name: Java CI - Maven

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]

permissions:
  contents: read

jobs:
  build:
    name: Build (package)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 1.8
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'
          cache: 'maven'

      - name: Run tests (maven verify)
        run: mvn -B -DskipTests=false verify

      - name: Generate static analysis reports (Checkstyle / PMD / SpotBugs)
        run: |
          mvn -B checkstyle:checkstyle pmd:pmd spotbugs:spotbugs || true

      - name: Generate JaCoCo coverage report
        run: mvn -B org.jacoco:jacoco-maven-plugin:0.8.8:report || true

      - name: Upload compiled jars
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: target/*.jar

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: target/surefire-reports/**

      - name: Upload static analysis reports
        uses: actions/upload-artifact@v4
        with:
          name: analysis-reports
          path: target/site/**

      - name: Upload jacoco report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/**
